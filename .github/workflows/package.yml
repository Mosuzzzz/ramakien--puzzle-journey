name: Package game

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Windows
        run: mkdir -p build/windows && godot --headless --path . --export-release "Windows"

      - name: Export Linux
        run: mkdir -p build/linux && godot --headless --path . --export-release "Linux"

      - name: Export macOS
        run: mkdir -p build/macos && godot --headless --path . --export-release "macOS"

      - name: Create download archives
        run: |
          mkdir -p dist
          (cd build/windows && zip -9 -r ../../dist/ramakien-puzzle-journey-windows.zip .)
          (cd build/linux && chmod +x ramakien-puzzle-journey.x86_64 && tar -czf ../../dist/ramakien-puzzle-journey-linux.tar.gz .)
          cp "build/macos/Ramakien Puzzle Journey.zip" dist/ramakien-puzzle-journey-macos.zip

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ramakien-puzzle-journey
          path: dist/*
          if-no-files-found: error

      - name: Add packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

